name: Build reviewed resume

on:
  push:
    branches:
      - feat/anthropic-resume-review-2026
    paths:
      - static/resumes/DylanMadisetti.tex
      - static/resumes/semantic-resume.cls
      - .github/workflows/build-reviewed-resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviewed-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra poppler-utils
      - name: Build and validate the two-page PDF
        run: |
          mkdir -p /tmp/resume-build
          cd static/resumes
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -outdir=/tmp/resume-build DylanMadisetti.tex
          test -s /tmp/resume-build/DylanMadisetti.pdf
          test "$(pdfinfo /tmp/resume-build/DylanMadisetti.pdf | awk '/^Pages:/ { print $2 }')" = "2"
          pdftotext -layout /tmp/resume-build/DylanMadisetti.pdf /tmp/resume-build/DylanMadisetti.txt
          grep -q '[[:alnum:]]' /tmp/resume-build/DylanMadisetti.txt
          install -m 0644 /tmp/resume-build/DylanMadisetti.pdf DylanMadisetti.pdf
      - name: Commit generated PDF
        run: |
          if git diff --quiet -- static/resumes/DylanMadisetti.pdf; then
            echo "Generated PDF is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/resumes/DylanMadisetti.pdf
          git commit -m "build: regenerate reviewed resume"
          git push
